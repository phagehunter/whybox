name: validate

# Two jobs, matching the two things that can be broken here: the toolkit, and
# any individual sandbox. A sandbox that leaks its answer key fails the build.

on:
  push:
  pull_request:

jobs:
  toolkit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
      - name: Install the package and run it from somewhere else
        # This is the check a src layout would have bought us: it catches a
        # file that works from the repository and is missing from the built
        # package. Done this way so a student can still clone and run with no
        # install at all.
        run: |
          set -e
          python -m pip install --quiet .
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          whybox --help > /dev/null
          python -c "import whybox, whybox.cli, whybox.judge, whybox.leaderboard; print(whybox.__version__)"

  sandboxes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every sandbox in this repository
        run: |
          set -e
          for dir in sandboxes/*/; do
            if [ -f "$dir/sandbox.yaml" ]; then
              echo "::group::$dir"
              python -m whybox check "$dir"
              echo "::endgroup::"
            fi
          done
      - name: Confirm the baselines still run end to end
        run: |
          python -m whybox run codon-lite --agent random --rounds 5 --quiet
          python -m whybox run codon-lite --agent hillclimb --rounds 5 --quiet
      - name: Confirm every published leaderboard row is still valid
        run: python tools/validate_leaderboard.py leaderboard/results.jsonl
      - name: Report how inflatable each sandbox's grading is
        run: |
          set -e
          for dir in sandboxes/*/; do
            if [ -f "$dir/sandbox.yaml" ]; then
              python -m whybox audit "$dir"
            fi
          done
      - name: Confirm an agent run leaves no answer key behind
        run: |
          set -e
          python -m whybox run codon-lite --agent hillclimb --rounds 3 --quiet
          if ls runs/*/answer_key.json >/dev/null 2>&1; then
            echo "an agent run wrote the hidden rule to disk"
            exit 1
          fi
          echo "no answer key written, as intended"
